name: Sync final static site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-site.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download final static site
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ribarnica-borca-stage.lovable.app"
          mkdir -p images

          # Exact standalone HTML prepared in Lovable for GitHub deployment.
          curl -fL "$BASE/site-source.txt" -o index.html
          curl -fL "$BASE/favicon.ico" -o favicon.ico

          # Keep photo assets local in this repository.
          curl -fL "$BASE/hero.jpg" -o images/hero.jpg
          curl -fL "$BASE/seafood.png" -o images/seafood.png
          curl -fL "$BASE/hot.jpg" -o images/hot.jpg
          curl -fL "$BASE/fillets.jpg" -o images/fillets.jpg

          cat > robots.txt <<'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://ribarnicaborca.online/sitemap.xml
          EOF

          cat > sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://ribarnicaborca.online/</loc>
              <lastmod>2026-08-12</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

          printf 'ribarnicaborca.online\n' > CNAME
          touch .nojekyll

      - name: Verify production files
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<!doctype html>' index.html
          grep -q 'https://ribarnicaborca.online/' index.html
          grep -q 'tel:+381611030053' index.html
          grep -q 'https://wa.me/381611030053' index.html
          grep -q 'https://www.instagram.com/mata_laza_ribarnica/' index.html
          grep -q 'Milana Toplice 2a' index.html
          grep -q 'Brancin' index.html
          grep -q 'Panirani losos' index.html
          test "$(grep -o '<h1' index.html | wc -l)" -eq 1
          file favicon.ico | grep -qi 'icon\|image'
          file images/hero.jpg | grep -qi 'JPEG image data'
          file images/seafood.png | grep -qi 'PNG image data'
          file images/hot.jpg | grep -qi 'JPEG image data'
          file images/fillets.jpg | grep -qi 'JPEG image data'
          grep -q 'https://ribarnicaborca.online/sitemap.xml' robots.txt
          grep -q '<loc>https://ribarnicaborca.online/</loc>' sitemap.xml

      - name: Commit final website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.ico images robots.txt sitemap.xml CNAME .nojekyll
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "Deploy final Ribarnica Borča website"
            git push
          fi
